version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      actions-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
