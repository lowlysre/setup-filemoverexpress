name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z) to point its major tag (vX) at
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      major: ${{ steps.tag.outputs.major }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Validate tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The release tag must match vX.Y.Z (for example v1.2.3)."
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "major=v${BASH_REMATCH[1]}"
          } >> "$GITHUB_OUTPUT"

      - name: Check the release is published and not a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          state="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease -q '"\(.isDraft) \(.isPrerelease)"')"
          if [[ "$state" != "false false" ]]; then
            echo "::error::Release ${TAG} is a draft or prerelease (isDraft isPrerelease = ${state})."
            exit 1
          fi

      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main
        id: commit
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::The release commit ${sha} is not on main."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Configure npm
        uses: lowlydba/sustainable-npm@4cc1da285e5a589a7b3816122f791c21ec6ff3e6 # v4.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check dist/ matches the tag
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "::error::dist/ at this tag does not match 'npm run build'. Rebuild, commit, and cut a new release."
            git status --porcelain -- dist/
            exit 1
          fi

  move-major-tag:
    name: Move major tag
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create or update the major tag ref
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443

      - name: Point the major tag at the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          MAJOR: ${{ needs.verify.outputs.major }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${MAJOR}" --silent 2>/dev/null; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR}" \
              -f sha="$SHA" -F force=true --silent
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${MAJOR}" -f sha="$SHA" --silent
          fi
          echo "${MAJOR} -> ${TAG} (${SHA})" >> "$GITHUB_STEP_SUMMARY"
